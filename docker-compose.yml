services:
  postgres:
    image: postgres:17-alpine
    container_name: support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for S3 (attachments). The storage abstraction in
  # apps/api/src/storage keeps call sites identical across drivers, so this is
  # optional until Phase 6 — the filesystem driver is the default locally.
  minio:
    image: minio/minio:latest
    container_name: support-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: support
      MINIO_ROOT_PASSWORD: supportsupport
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    profiles:
      - storage

volumes:
  postgres-data:
  minio-data:
