name: CI

on:
  # Every branch, not just main: a branch without an open pull request would
  # otherwise get no CI at all, which is how three commits once landed here
  # unverified.
  push:
    branches: ['**']
  pull_request:

# Keyed on the head branch so a push run and a pull_request run for the same
# branch share one group and the newer cancels the older, rather than both
# running every time.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://support:support@localhost:5432/helpdesk?connection_limit=5&pool_timeout=10
  TEST_DATABASE_URL: postgres://support:support@localhost:5432/helpdesk_test?connection_limit=5&pool_timeout=10

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/server and apps/client resolve @support/shared through its dist/ output,
      # which is gitignored. Typecheck and test both fail on a clean checkout
      # without this, and pass locally only on a machine with a stale build.
      - name: Build the shared package
        run: pnpm --filter @support/shared build

      - name: Create the test database
        run: PGPASSWORD=support psql -h localhost -U support -d helpdesk -c 'CREATE DATABASE helpdesk_test OWNER support;'

      - name: Generate the Prisma client
        run: pnpm --filter @support/server exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @support/server exec prisma migrate deploy

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Seed and verify the fixtures load
        run: pnpm db:seed
        env:
          BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
          BOOTSTRAP_ADMIN_NAME: CI Admin
